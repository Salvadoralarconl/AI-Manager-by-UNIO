<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Sign in · AI Manager</title>
  <link rel="icon" href="/icon.svg">

</head>
<body>

    </form>
  </main>
  <script type="module" src="/login.js"></script>

</html>
